<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectando con Dropbox - Bitácora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F7F4EE;
      color: #2B2A28;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4DECE;
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #0061FE;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
    h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #8A8478;
      line-height: 1.5;
    }
    .error {
      color: #B4553F;
    }
    .spinner {
      margin: 18px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid #E4DECE;
      border-top-color: #0061FE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <!-- Dropbox Glyphs Logo -->
      <svg viewBox="0 0 24 24">
        <path d="M6 3.5L12 7.4 6 11.3 0 7.4 6 3.5zm12 0l6 3.9-6 3.9-6-3.9 6-3.9zM0 15.2l6-3.9 6 3.9-6 3.9-6-3.9zm24 0l-6-3.9-6 3.9 6 3.9 6-3.9zM6 19.8l6-3.9 6 3.9-6 3.9-6-3.9z"/>
      </svg>
    </div>
    <h2 id="title">Conectando con Dropbox...</h2>
    <p id="desc">Completando la autenticación de Bitácora. Esta ventana se cerrará automáticamente.</p>
    <div class="spinner" id="spinner"></div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error_description') || params.get('error');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const spinnerEl = document.getElementById('spinner');

      if (error) {
        titleEl.textContent = 'Error de autorización';
        titleEl.classList.add('error');
        descEl.textContent = error;
        spinnerEl.style.display = 'none';

        if (window.opener) {
          window.opener.postMessage({ type: 'DROPBOX_AUTH_RESULT', error }, '*');
          setTimeout(() => window.close(), 3000);
        }
        return;
      }

      if (code) {
        titleEl.textContent = '¡Cuenta vinculada con éxito!';
        descEl.textContent = 'Guardando credenciales en Bitácora...';

        if (window.opener) {
          window.opener.postMessage({ type: 'DROPBOX_AUTH_RESULT', code }, '*');
          setTimeout(() => window.close(), 800);
        } else {
          // Si no hay window.opener (redirección completa en misma ventana), volver al inicio
          window.location.href = '/?dropbox_code=' + encodeURIComponent(code);
        }
      } else {
        titleEl.textContent = 'No se recibió código';
        descEl.textContent = 'Puedes cerrar esta pestaña y volver a intentarlo.';
        spinnerEl.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
